services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: IceBot-rag-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ../data/qdrant:/qdrant/storage

  aspire-dashboard:
    image: ${ASPIRE_DASHBOARD_IMAGE:-mcr.microsoft.com/dotnet/aspire-dashboard:13}
    container_name: IceBot-tools-aspire-dashboard
    profiles:
      - observability
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:18889:18889"
    environment:
      ASPNETCORE_URLS: http://+:18888
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: http://+:18889

  mqtt-init:
    image: eclipse-mosquitto:2.0.20
    profiles:
      - mqtt
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-icebot-local-backend}
    command:
      - /bin/sh
      - -c
      - >-
        cp /mqtt-bootstrap/mosquitto.conf /mosquitto/config/mosquitto.conf &&
        cp /mqtt-bootstrap/acl /mosquitto/config/acl &&
        touch /mosquitto/data/password_file &&
        mosquitto_passwd -b /mosquitto/data/password_file icebot-backend "$${MQTT_BACKEND_PASSWORD}" &&
        chmod 0600 /mosquitto/config/mosquitto.conf /mosquitto/config/acl /mosquitto/data/password_file
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-config:/mosquitto/config
      - ./mqtt/mosquitto.conf:/mqtt-bootstrap/mosquitto.conf:ro
      - ./mqtt/acl:/mqtt-bootstrap/acl:ro
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: IceBot-tools-mosquitto
    profiles:
      - mqtt
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - mqtt-config:/mosquitto/config
      - mqtt-data:/mosquitto/data

volumes:
  mqtt-config:
  mqtt-data:
