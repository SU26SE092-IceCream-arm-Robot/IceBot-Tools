services:
  qdrant:
    image: qdrant/qdrant:v1.18.1
    container_name: IceBot-rag-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ../data/qdrant:/qdrant/storage

  aspire-dashboard:
    image: ${ASPIRE_DASHBOARD_IMAGE:-mcr.microsoft.com/dotnet/aspire-dashboard:13}
    container_name: IceBot-tools-aspire-dashboard
    profiles:
      - observability
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:18889:18889"
    environment:
      ASPNETCORE_URLS: http://+:18888
      DOTNET_DASHBOARD_OTLP_ENDPOINT_URL: http://+:18889

  mqtt-init:
    image: eclipse-mosquitto:2.0.20
    profiles:
      - mqtt
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-icebot-local-backend}
      MQTT_DYNSEC_ADMIN_PASSWORD: ${MQTT_DYNSEC_ADMIN_PASSWORD:-icebot-local-dynsec-admin}
    command:
      - /bin/sh
      - -c
      - >-
        cp /mqtt-bootstrap/mosquitto.conf /mosquitto/config/mosquitto.conf &&
        if [ ! -s /mosquitto/data/dynamic-security.json ]; then
          printf '%s\n%s\n' "$${MQTT_DYNSEC_ADMIN_PASSWORD}" "$${MQTT_DYNSEC_ADMIN_PASSWORD}" |
          mosquitto_ctrl dynsec init /mosquitto/data/dynamic-security.json icebot-dynsec-admin;
        fi &&
        chmod 0600 /mosquitto/config/mosquitto.conf /mosquitto/data/dynamic-security.json
    volumes:
      - mqtt-data:/mosquitto/data
      - mqtt-config:/mosquitto/config
      - ./mqtt/mosquitto.conf:/mqtt-bootstrap/mosquitto.conf:ro
    restart: "no"

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    container_name: IceBot-tools-mosquitto
    profiles:
      - mqtt
    depends_on:
      mqtt-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - mqtt-config:/mosquitto/config
      - mqtt-data:/mosquitto/data

  mqtt-bootstrap:
    image: eclipse-mosquitto:2.0.20
    profiles:
      - mqtt
    depends_on:
      - mosquitto
    environment:
      MQTT_BACKEND_PASSWORD: ${MQTT_BACKEND_PASSWORD:-icebot-local-backend}
      MQTT_DYNSEC_ADMIN_PASSWORD: ${MQTT_DYNSEC_ADMIN_PASSWORD:-icebot-local-dynsec-admin}
    command:
      - /bin/sh
      - -c
      - >-
        sleep 2;
        mosquitto_ctrl -h mosquitto -u icebot-dynsec-admin -P "$${MQTT_DYNSEC_ADMIN_PASSWORD}" dynsec createRole icebot-endpoint-subscriber >/dev/null 2>&1 || true;
        mosquitto_ctrl -h mosquitto -u icebot-dynsec-admin -P "$${MQTT_DYNSEC_ADMIN_PASSWORD}" dynsec addRoleACL icebot-endpoint-subscriber subscribePattern 'icebot/execution-endpoints/%u/commands/available' allow >/dev/null 2>&1 || true;
        mosquitto_ctrl -h mosquitto -u icebot-dynsec-admin -P "$${MQTT_DYNSEC_ADMIN_PASSWORD}" dynsec addRoleACL icebot-endpoint-subscriber publishClientReceive 'icebot/execution-endpoints/%u/commands/available' allow >/dev/null 2>&1 || true;
        mosquitto_ctrl -h mosquitto -u icebot-dynsec-admin -P "$${MQTT_DYNSEC_ADMIN_PASSWORD}" dynsec createRole icebot-backend-publisher >/dev/null 2>&1 || true;
        mosquitto_ctrl -h mosquitto -u icebot-dynsec-admin -P "$${MQTT_DYNSEC_ADMIN_PASSWORD}" dynsec addRoleACL icebot-backend-publisher publishClientSend 'icebot/execution-endpoints/+/commands/available' allow >/dev/null 2>&1 || true;
        mosquitto_ctrl -h mosquitto -u icebot-dynsec-admin -P "$${MQTT_DYNSEC_ADMIN_PASSWORD}" dynsec createClient icebot-backend "$${MQTT_BACKEND_PASSWORD}" >/dev/null 2>&1 || true;
        mosquitto_ctrl -h mosquitto -u icebot-dynsec-admin -P "$${MQTT_DYNSEC_ADMIN_PASSWORD}" dynsec setClientPassword icebot-backend "$${MQTT_BACKEND_PASSWORD}" >/dev/null 2>&1;
        mosquitto_ctrl -h mosquitto -u icebot-dynsec-admin -P "$${MQTT_DYNSEC_ADMIN_PASSWORD}" dynsec addClientRole icebot-backend icebot-backend-publisher -1 >/dev/null 2>&1 || true
    restart: "no"

volumes:
  mqtt-config:
  mqtt-data:
